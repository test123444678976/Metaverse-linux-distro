# Metaverse Linux 1.0.0 - Framboesa - GRUB
set timeout=5
set default=0
set gfxmode=1024x768
set gfxpayload=keep

insmod all_video
insmod gfxterm
insmod png
insmod iso9660

if loadfont /boot/grub/fonts/unicode.pf2 ; then
  set gfxmode=auto
  terminal_output gfxterm
fi

set menu_color_normal=white/black
set menu_color_highlight=white/magenta

background_image /boot/wallpaper.png || background_image /boot/logo.png

menuentry "Metaverse Linux 1.0.0 - Framboesa" --class metaverse --class gnu-linux --class gnu --class os {
  linux /boot/vmlinuz-metaverse root=/dev/sr0 quiet splash loglevel=3
  initrd /boot/initramfs.img
}

menuentry "Metaverse Linux (Safe Mode)" --class metaverse {
  linux /boot/vmlinuz-metaverse root=/dev/sr0 single nomodeset
  initrd /boot/initramfs.img
}

menuentry "Metaverse Linux (Debug)" --class metaverse {
  linux /boot/vmlinuz-metaverse root=/dev/sr0 debug systemd.log_level=debug
  initrd /boot/initramfs.img
}
