name: Build Metaverse Linux ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex texinfo \
            xorriso isolinux grub-pc-bin mtools dosfstools qemu-utils \
            squashfs-tools genisoimage wget curl git python3

      - name: Dar permissão aos scripts
        run: chmod +x scripts/*.sh run-qemu.sh

      - name: Build ISO
        run: sudo bash scripts/build-all.sh

      - name: Ver o ISO criado
        run: ls -lh output/ || ls -lh *.iso || ls -lh .

      - name: Upload ISO como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: metaverse-linux-framboesa-iso
          path: |
            output/*.iso
            *.iso
          if-no-files-found: warn

      - name: Criar Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-framboesa
          name: Metaverse Linux 1.0.0 - Framboesa
          body: |
            💜 Metaverse Linux 1.0.0 - Framboesa
            LFS 12.2 + MATE 1.28 + X.org + Mesa
            User: metaverse / Pass: metaverse
          files: |
            output/*.iso
            *.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
