name: Build Metaverse Linux ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential xorriso grub-pc-bin mtools dosfstools squashfs-tools genisoimage wget curl git python3

      - name: Dar permissão aos scripts
        run: |
          chmod +x scripts/*.sh || true
          chmod +x run-qemu.sh || true
          ls -R

      - name: Build ISO
        run: sudo bash scripts/build-all.sh

      - name: Ver o ISO criado
        run: |
          pwd
          ls -lhR output/ || true
          find . -name "*.iso" -ls || true

      - name: Upload ISO como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: metaverse-linux-framboesa-iso
          path: output/*.iso
          if-no-files-found: warn

      - name: Criar Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-framboesa
          name: Metaverse Linux 1.0.0 - Framboesa
          body: |
            💜 Metaverse Linux 1.0.0 - Framboesa
            User: metaverse / Pass: metaverse
          files: output/*.iso
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
